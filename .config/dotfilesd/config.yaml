# dotfilesd daemon configuration
port: 9105
log:
  dir: /home/manu343726/dotfilesd/logs
  level: trace  # trace | debug | info | warn | error
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30

# Plugin system
plugins_dir: ~/.config/dotfilesd/plugins
plugin_cache_dir: ~/.cache/dotfilesd/plugins

# Sudo credential cache: per-session, TTL in seconds. Once a session
# authenticates (terminal/elicitation prompt), the password is reused by
# sudo commands in that session while the cache is alive, sliding on use.
# Per-call override: dotfilesctl exec --sudo-timeout / MCP exec_run sudo_timeout.
sudo:
  timeout: 300
