## Bluetooth audio tuning for portatilmanu.
##
## Host adapter: MediaTek MT7922 combo (WiFi mt7921e PCIe + BT USB 13d3:3568).
## WiFi and BT share the same front-end, so codec bitrate and coexistence both
## matter a lot on this machine.
##
## Test: the SMSL AD18 advertises aptX HD, but this host cannot sustain the
## 576 kbps stream. Symptoms on the amp:
##   - "spa.bluez5.sink.media: connection (...) terminated unexpectedly"
##   - "a2dp.c:connect_cb() HUP or ERR on socket: Connection reset by peer (104)"
##   - "avdtp.c:handle_unanswered_req() No reply to Suspend request"
##   - constant micro-cuts / stuttering, 6 stream re-negotiations in 5 minutes
## A phone paired to the same amp plays fine (it negociates a much lower
## bitrate), so this is host-side. Forcing plain SBC is the decisive test.

monitor.bluez.properties = {
  ## Restrict A2DP to plain SBC. PipeWire ranks codecs by quality internally,
  ## so the high-bitrate ones must be removed from the list, not just
  ## reordered: aptX HD (576 kbps) > LDAC > aptX > AAC > SBC-XQ > SBC.
  bluez5.codecs = [ sbc ]

  ## SBC-XQ is "nonstandard" SBC at up to ~551 kbps; same problem as above.
  bluez5.enable-sbc-xq = false
}

## The AD18 never answers AVDTP Suspend: BlueZ logs
##   "avdtp.c:cancel_request() Suspend: Connection timed out (110)"
##   "avdtp.c:handle_unanswered_req() No reply to Suspend request"
## and right after, the transport is torn down and the amp drops the ACL
## itself ("Reason: Remote User Terminated Connection (0x13)" in btmon).
## Never suspend the A2DP node, so the host never sends that Suspend.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
