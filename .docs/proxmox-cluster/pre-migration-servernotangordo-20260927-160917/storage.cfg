dir: local
	path /var/lib/vz
	content vztmpl,backup,snippets,iso

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

nfs: casa_nas_backups
	export /volume1/Backups
	path /mnt/pve/casa_nas_backups
	server 192.168.100.112
	content backup
	prune-backups keep-daily=7,keep-weekly=8,keep-monthly=6

lvm: pve2
	vgname pve2
	content rootdir,images
	nodes servergordo
	shared 0

